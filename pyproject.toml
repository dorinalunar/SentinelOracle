[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-oracle"
version = "1.0.0"
description = "Decentralized multi-agent AI oracle and native GEN escrow protocol on GenLayer (GenVM v0.3.0)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Andrii (dorinalunar)" }
]
dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=8.0.0"
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = [
  "."
]
python_files = "test_*.py"
